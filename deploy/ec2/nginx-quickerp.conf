# Quick ERP on one server: the frontend at /, the backend API at /api/ (same address, no CORS needed).
server {
    listen 80;
    server_name __SERVER_NAME__;
    server_tokens off;

    root /var/www/quickerp;
    index index.html;

    # File uploads up to 20 MB.
    client_max_body_size 21m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Set here, never taken from the visitor, so sign-in rate limits cannot be bypassed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built frontend files never change their names' content, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The frontend handles its own pages (/dashboard, /shop/..., /reset-password, ...).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
