# Starts PostgreSQL and the Quick ERP backend.
# Usage: copy .env.example to .env, fill in the secrets, then run: docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-quickerp}
      POSTGRES_USER: ${DB_USERNAME:-quickerp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    # Reachable only from this machine (and from the backend container), never from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - quickerp-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-quickerp} -d ${DB_NAME:-quickerp}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-quickerp}
      DB_USERNAME: ${DB_USERNAME:-quickerp}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-QuickERP123!}
      NEW_USER_INITIAL_PASSWORD: ${NEW_USER_INITIAL_PASSWORD-ChangeMe123!}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
      MAIL_FROM: ${MAIL_FROM:-no-reply@quickerp.local}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_MAX_HISTORY_MESSAGES: ${AI_MAX_HISTORY_MESSAGES:-12}
      AI_USER_REQUESTS_PER_MINUTE: ${AI_USER_REQUESTS_PER_MINUTE:-20}
      AI_TENANT_REQUESTS_PER_HOUR: ${AI_TENANT_REQUESTS_PER_HOUR:-500}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-30}
      AI_MAX_INPUT_CHARACTERS: ${AI_MAX_INPUT_CHARACTERS:-2000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1024}
      AI_MAX_TOOL_ROUNDS: ${AI_MAX_TOOL_ROUNDS:-5}
      AI_MAX_TOOL_CALLS: ${AI_MAX_TOOL_CALLS:-12}
      AI_MAX_PARALLEL_TOOLS: ${AI_MAX_PARALLEL_TOOLS:-3}
      AI_MAX_RESPONSE_DATA_BYTES: ${AI_MAX_RESPONSE_DATA_BYTES:-100000}
      AI_TOTAL_REQUEST_TIMEOUT_MS: ${AI_TOTAL_REQUEST_TIMEOUT_MS:-60000}
      AI_MAX_CONTEXT_CHARACTERS: ${AI_MAX_CONTEXT_CHARACTERS:-24000}
      AI_TOOL_TRANSPORT: ${AI_TOOL_TRANSPORT:-direct}
      AI_MCP_ENABLED: ${AI_MCP_ENABLED:-false}
      AI_MCP_URL: ${AI_MCP_URL:-http://127.0.0.1:8000/api/v1/mcp}
      AI_CONVERSATION_RETENTION_DAYS: ${AI_CONVERSATION_RETENTION_DAYS:-90}
      AI_QUERY_MAX_ROWS: ${AI_QUERY_MAX_ROWS:-100}
      AI_QUERY_DEFAULT_ROWS: ${AI_QUERY_DEFAULT_ROWS:-25}
      AI_QUERY_TIMEOUT_MS: ${AI_QUERY_TIMEOUT_MS:-3000}
      AI_QUERY_MAX_FILTERS: ${AI_QUERY_MAX_FILTERS:-10}
      AI_QUERY_MAX_AGGREGATION_GROUPS: ${AI_QUERY_MAX_AGGREGATION_GROUPS:-100}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-native}
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:8000:8000"

volumes:
  quickerp-db:
