name: AI quality gates

on:
  pull_request:
  push:
    branches: [main, ai-assistant]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quickerp_test
          POSTGRES_USER: quickerp_test
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U quickerp_test -d quickerp_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test and package backend with isolated PostgreSQL schemas
        working-directory: backend
        env:
          QUICKERP_TEST_DB_URL: jdbc:postgresql://localhost:5432/quickerp_test?user=quickerp_test&password=test-only-password
        run: bash ./mvnw -B clean package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile
      - name: Typecheck, lint, AI QA and build
        working-directory: frontend
        run: |
          corepack pnpm typecheck
          corepack pnpm lint
          corepack pnpm qa:all
          corepack pnpm qa:ai-evaluation
          corepack pnpm build
      - name: Dependency audit
        working-directory: frontend
        run: corepack pnpm audit --audit-level high
